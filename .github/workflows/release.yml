name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - platform: ubuntu-latest
            # x86_64 native + aarch64 via qemu
            CIBW_ARCHS: "x86_64 aarch64"
          - platform: macos-latest
            CIBW_ARCHS: "x86_64 arm64"
          - platform: windows-latest
            CIBW_ARCHS: "AMD64"
    env:
      CIBW_ARCHS: ${{ matrix.CIBW_ARCHS }}
      # setup-python exports Python_ROOT_DIR pointing at the HOST python;
      # cibuildwheel leaks it into the manylinux container where the path
      # does not exist, breaking FindPython.  Empty values fall back to
      # default search (in-container interpreter).
      Python_ROOT_DIR: ""
      Python2_ROOT_DIR: ""
      Python3_ROOT_DIR: ""
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.23
        env:
          # CMake >= 4 regressed FindPython on manylinux images; the
          # container ships cmake 4.0 via pipx, downgrade to 3.31.
          CIBW_BEFORE_ALL_LINUX: pipx install --force cmake==3.31.6
        with:
          output-dir: wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}
          path: ./wheelhouse/*.whl

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist
        run: |
          pip install build
          python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  release:
    name: Create GitHub Release
    needs: [build-wheels, build-sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub Release with assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true

  # PyPI publishing is disabled until trusted publishing is configured
  # (create a PyPI project for pydramsim3 and add this repo as a trusted
  # publisher), then uncomment this job.
