[build-system]
requires = [
    "scikit-build-core >= 0.10",
    "pybind11 >= 2.11"
]
build-backend = "scikit_build_core.build"

[project]
name = "pydramsim3"
version = "0.1.0"
description = "High-performance Python bindings for the DRAMsim3 cycle-accurate memory simulator with a gem5-aligned controller API"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Shi Chen", email = "chenshi8603@163.com" }]
maintainers = [{ name = "Shi Chen", email = "chenshi8603@163.com" }]
requires-python = ">=3.8"
dependencies = ["numpy >= 1.17"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
    "Typing :: Typed"
]

[project.urls]
Homepage = "https://gitee.com/chenshih1/pydramsim3"
Repository = "https://github.com/chenshih1/pydramsim3"

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
build.verbose = false
cmake.build-type = "Release"
wheel.install-dir = "pydramsim3"
wheel.expand-macos-universal-tags = false
wheel.exclude = [
    "pydramsim3/*.cpp",
    "pydramsim3/*.hpp",
]
# The DRAMsim3 submodule is a gitlink in the index; declare it explicitly
# so sdist builds from a real git checkout include the vendored sources.
sdist.include = ["third_party/dramsim3"]

logging.level = "WARNING"

[project.optional-dependencies]
test = ["pytest >= 7.0", "pytest-cov >= 4.0", "ruff >= 0.6"]

[tool.cibuildwheel]
build = "cp38-* cp39-* cp310-* cp311-* cp312-* cp313-*"
# manylinux2014 images are EOL (CentOS 7); use manylinux_2_28.
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
test-command = "python -c \"import pydramsim3; print(pydramsim3.__version__)\""

[tool.pytest.ini_options]
testpaths = ["tests"]